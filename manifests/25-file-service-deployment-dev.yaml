kind: Deployment
apiVersion: apps/v1
metadata:
  name: alkemio-file-service-deployment
  labels:
    app: alkemio-file-service
    k8s-app: alkemio-file-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alkemio-file-service
  template:
    metadata:
      labels:
        app: alkemio-file-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: alkemio-file-service
          # Placeholder image; the deploy workflow overwrites this via
          # `kubectl set image` with the freshly built, SHA-tagged image.
          image: rg.nl-ams.scw.cloud/alkemio/alkemio-file-service:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 4003
          env:
            - name: ALKEMIO_DATABASE_HOST
              valueFrom:
                configMapKeyRef:
                  name: alkemio-config
                  key: DATABASE_HOST
            - name: ALKEMIO_DATABASE_PORT
              valueFrom:
                configMapKeyRef:
                  name: alkemio-config
                  key: DATABASE_PORT
            - name: ALKEMIO_DATABASE_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: alkemio-config
                  key: POSTGRES_USER
            - name: ALKEMIO_DATABASE_PASSWORD
              valueFrom:
                configMapKeyRef:
                  name: alkemio-config
                  key: POSTGRES_PASSWORD
            - name: ALKEMIO_DATABASE_NAME
              value: "alkemio"
            - name: AUTH_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: alkemio-config
                  key: AUTH_SERVICE_URL
            - name: LOCAL_STORAGE_PATH
              valueFrom:
                configMapKeyRef:
                  name: alkemio-config
                  key: LOCAL_STORAGE_PATH
            - name: STORAGE_TYPE
              value: "local"
            - name: LOG_LEVEL
              value: "info"
          volumeMounts:
            - name: file-storage
              mountPath: /storage
          # Readiness: checks dependencies (DB, NATS). Pulls pod from Service
          # when deps are unreachable so traffic doesn't hit a broken instance.
          readinessProbe:
            httpGet:
              path: /health
              port: 4003
            initialDelaySeconds: 5
            periodSeconds: 15
            failureThreshold: 3
          # Liveness: process-alive check only, no deps. Restarting the pod
          # when the DB is down would not fix anything and would amplify an
          # outage. Separate /live endpoint avoids that.
          livenessProbe:
            httpGet:
              path: /live
              port: 4003
            initialDelaySeconds: 5
            periodSeconds: 60
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: file-storage
          persistentVolumeClaim:
            claimName: file-storage-pvc2
      affinity:
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: alkemio-server
                topologyKey: kubernetes.io/hostname
            - weight: 50
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: alkemio-authorization-evaluation-service
                topologyKey: kubernetes.io/hostname
