apiVersion: apps/v1
kind: Deployment
metadata:
  name: alkemio-file-service-deployment
  labels:
    app: alkemio-file-service
    k8s-app: alkemio-file-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alkemio-file-service
  template:
    metadata:
      labels:
        app: alkemio-file-service
    spec:
      containers:
        - name: alkemio-file-service
          image: alkemio/file-service-go:v0.0.4
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 4003
          env:
            - name: ALKEMIO_DATABASE_HOST
              valueFrom:
                configMapKeyRef:
                  name: alkemio-config
                  key: DATABASE_HOST
            - name: ALKEMIO_DATABASE_PORT
              valueFrom:
                configMapKeyRef:
                  name: alkemio-config
                  key: DATABASE_PORT
            - name: ALKEMIO_DATABASE_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: alkemio-config
                  key: POSTGRES_USER
            - name: ALKEMIO_DATABASE_PASSWORD
              valueFrom:
                configMapKeyRef:
                  name: alkemio-config
                  key: POSTGRES_PASSWORD
            - name: ALKEMIO_DATABASE_NAME
              value: "alkemio"
            - name: AUTH_SERVICE_URL
              value: "http://alkemio-authorization-evaluation-service:6060"
            - name: LOCAL_STORAGE_PATH
              value: "/storage"
            - name: STORAGE_TYPE
              value: "local"
            - name: LOG_LEVEL
              value: "info"
          volumeMounts:
            - name: file-storage
              mountPath: /storage
          readinessProbe:
            httpGet:
              path: /health
              port: 4003
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 4003
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: file-storage
          persistentVolumeClaim:
            claimName: file-storage-pvc
      affinity:
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: alkemio-server
                topologyKey: kubernetes.io/hostname
            - weight: 50
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: alkemio-authorization-evaluation-service
                topologyKey: kubernetes.io/hostname
