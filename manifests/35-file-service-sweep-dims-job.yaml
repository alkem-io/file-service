# One-shot image-dimension backfill (spec 019/020). Run MANUALLY after a deploy to populate
# imageWidth/imageHeight on legacy image rows whose content_metadata is still empty (new writes
# measure dims inline; this drains the finite pre-existing set). It is NOT part of the auto-applied
# deployment — apply it deliberately, and delete/recreate it to re-run:
#
#   kubectl -n <ns> apply -f 35-file-service-sweep-dims-job.yaml
#   kubectl -n <ns> logs -f job/alkemio-file-service-sweep-dims   # read measured/decode_failed/skipped
#
# BEFORE APPLYING, set the two env-specific values to match the TARGET namespace's file-service
# deployment (there is no `kubectl set image` / overlay automation for a hand-applied Job):
#   - image:      the SAME SHA-tag the running deployment uses (do NOT leave :latest — with no
#                 set-image step it would pull a floating, unpinned build).
#   - claimName:  the file-service PVC of that env — dev: file-storage-pvc2, test: file-storage-pvc
#                 (25- vs 26- deployment). A wrong/absent PVC leaves the pod Pending forever.
#
# CO-LOCATION: the sweep reads blobs directly from the local-storage PVC (file-storage-pvc2), which
# is ReadWriteOnce — it can only be mounted on the node that already has it (the serving file-service
# pod). The REQUIRED podAffinity below forces this Job onto that same node; without it the pod stays
# Pending (multi-attach) — the same single-node constraint the file-service deployment lives under.
kind: Job
apiVersion: batch/v1
metadata:
  name: alkemio-file-service-sweep-dims
  # DISTINCT app label — deliberately NOT `alkemio-file-service`, so this non-serving pod is never
  # picked up by the file-service Service selector (30-...-service.yaml selects app:
  # alkemio-file-service). A sweep pod enrolled as a Service endpoint would refuse the ~half of
  # in-cluster file-service traffic routed to it (it has no HTTP listener). Co-location with the
  # serving pods is done by podAffinity below (which selects app: alkemio-file-service), not by
  # sharing the label.
  labels:
    app: alkemio-file-service-sweep-dims
    component: sweep-dims
spec:
  # ENDED-EARLY (a page-scan error / SIGTERM) exits 1; retry a couple of times then stop. An
  # all-skipped pass exits 0 (ambiguous — a convergent orphan tail or a transient outage — read the
  # logged counts to tell them apart), so backoffLimit is not a substitute for reading the summary.
  backoffLimit: 2
  # Reap the finished Job pod after an hour so a re-run isn't blocked by the old object.
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      # The POD-template labels are what the file-service Service selects on — must NOT include
      # app: alkemio-file-service (see the header labels comment).
      labels:
        app: alkemio-file-service-sweep-dims
        component: sweep-dims
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: alkemio-file-service-sweep-dims
          # SET PER ENV — pin to the deployment's SHA-tagged image (see header). NOT :latest.
          image: rg.nl-ams.scw.cloud/alkemio/alkemio-file-service:latest
          imagePullPolicy: Always
          args: ["sweep-dims"]
          env:
            - name: ALKEMIO_DATABASE_HOST
              valueFrom:
                configMapKeyRef:
                  name: alkemio-config
                  key: DATABASE_HOST
            - name: ALKEMIO_DATABASE_PORT
              valueFrom:
                configMapKeyRef:
                  name: alkemio-config
                  key: DATABASE_PORT
            - name: ALKEMIO_DATABASE_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: alkemio-config
                  key: POSTGRES_USER
            - name: ALKEMIO_DATABASE_PASSWORD
              valueFrom:
                configMapKeyRef:
                  name: alkemio-config
                  key: POSTGRES_PASSWORD
            - name: ALKEMIO_DATABASE_NAME
              value: "alkemio"
            # The sweep never authorizes, but it loads the same config as `serve`, which requires an
            # auth transport to be set — reuse the deployment's AUTH_SERVICE_URL. The value is unused.
            - name: AUTH_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: alkemio-config
                  key: AUTH_SERVICE_URL
            - name: LOCAL_STORAGE_PATH
              valueFrom:
                configMapKeyRef:
                  name: alkemio-config
                  key: LOCAL_STORAGE_PATH
            - name: STORAGE_TYPE
              value: "local"
            - name: LOG_LEVEL
              value: "info"
          volumeMounts:
            - name: file-storage
              mountPath: /storage
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              # Header-only decode (no pixel pass); mirrors the deployment's ceiling.
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: file-storage
          persistentVolumeClaim:
            # SET PER ENV — dev: file-storage-pvc2, test: file-storage-pvc (see header).
            claimName: file-storage-pvc2
      affinity:
        podAffinity:
          # REQUIRED (not preferred): the RWO PVC can only mount on the serving pod's node.
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: alkemio-file-service
              topologyKey: kubernetes.io/hostname
