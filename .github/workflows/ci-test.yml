name: CI — Lint & Test

on:
  push:
    branches: [develop, main]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  ci:
    uses: alkem-io/github-workflows/.github/workflows/go-ci.yml@v1
    permissions:
      contents: read
    with:
      sqlc-config: db/sqlc.yaml
      sqlc-generated-path: internal/adapter/outbound/alkemiodb/queries
      # Temporary: re-enable after https://github.com/antst/go-apispec/issues/83
      # is fixed. Keep openapi.yaml autogenerated; only the flaky diff gate skips.
      openapi-make-target: ''
      extra-suite-tags: vips
      extra-suite-apt: libvips-dev
