framework:
    routePatterns:
        - callRegex: (?i)(GET|POST|PUT|DELETE|PATCH|OPTIONS|HEAD)$
          recvTypeRegex: ^github.com/go-chi/chi(/v\d)?\.\*?(Router|Mux)$
          handlerArgIndex: 1
          methodFromCall: true
          pathFromArg: true
          handlerFromArg: true
    requestBodyPatterns:
        - callRegex: ^DecodeJSON$
          recvTypeRegex: ^github\.com/go-chi/render$
          typeArgIndex: 1
          typeFromArg: true
          deref: true
        - callRegex: ^Decode$
          recvTypeRegex: .*json(iter)?\.\*Decoder
          typeFromArg: true
          deref: true
        - callRegex: ^Unmarshal$
          recvTypeRegex: json
          typeArgIndex: 1
          typeFromArg: true
          deref: true
    responsePatterns:
        - callRegex: ^WriteHeader$
          recvTypeRegex: ^net/http\.ResponseWriter$
          typeArgIndex: -1
          statusFromArg: true
        - callRegex: ^Write$
          recvTypeRegex: ^net/http\.ResponseWriter$
          typeFromArg: true
          deref: true
        - callRegex: ^Error$
          recvTypeRegex: ^net/http$
          statusArgIndex: 2
          typeArgIndex: 1
          statusFromArg: true
          typeFromArg: true
          defaultContentType: text/plain; charset=utf-8
        - callRegex: ^NotFound$
          recvTypeRegex: ^net/http$
          statusArgIndex: -1
          typeArgIndex: -1
          defaultStatus: 404
        - callRegex: ^Redirect$
          recvTypeRegex: ^net/http$
          statusArgIndex: 3
          typeArgIndex: -1
          statusFromArg: true
        - callRegex: ^JSON$
          recvTypeRegex: ^github\.com/go-chi/render$
          typeArgIndex: 2
          typeFromArg: true
          deref: true
        - callRegex: ^Status$
          recvTypeRegex: ^github\.com/go-chi/render$
          statusArgIndex: 1
          statusFromArg: true
        - callRegex: ^Marshal$
          typeFromArg: true
          deref: true
        - callRegex: ^Encode$
          recvTypeRegex: .*json(iter)?\.\*?Encoder
          typeFromArg: true
          deref: true
    paramPatterns:
        - callRegex: ^URLParam$
          recvTypeRegex: ^github\.com/go-chi/chi(/v\d)?$
          paramIn: path
          paramArgIndex: 1
        - callRegex: ^URLParam$
          recvTypeRegex: ^github\.com/go-chi/chi(/v\d)?\.\*?Context$
          paramIn: path
        - callRegex: ^URLParamFromCtx$
          recvTypeRegex: ^github\.com/go-chi/chi(/v\d)?$
          paramIn: path
          paramArgIndex: 1
        - callRegex: ^FormValue$
          paramIn: form
        - callRegex: ^Get$
          recvType: net/url.Values
          paramIn: query
        - callRegex: ^PathValue$
          recvType: net/http.*Request
          paramIn: path
    mountPatterns:
        - callRegex: ^Mount$
          routerArgIndex: 1
          pathFromArg: true
          routerFromArg: true
          isMount: true
        - callRegex: ^Route$
          routerArgIndex: 1
          pathFromArg: true
          routerFromArg: true
          isMount: true
typeMapping: []
externalTypes: []
overrides: []
include:
    files: []
    packages: []
    functions: []
    types: []
exclude:
    files: []
    packages: []
    functions: []
    types: []
defaults:
    requestContentType: application/json
    responseContentType: application/json
    responseStatus: 200
info:
    title: Alkemio File Service
    description: |
        Universal file I/O gateway and document lifecycle manager for the Alkemio platform.
        Provides authenticated file serving (public), document CRUD, image processing,
        and MIME validation (internal).
    version: 1.0.0
    contact:
        name: Alkemio Foundation
        url: https://alkem.io
        email: info@alkem.io
    license:
        name: EUPL-1.2
        url: https://opensource.org/licenses/EUPL-1.2
