components:
  schemas:
    http.CopyDocumentRequest:
      properties:
        authorizationId:
          format: uuid
          type: string
        createdBy:
          type: string
        destinationBucketId:
          format: uuid
          type: string
        externalReference:
          type: string
        skipDedup:
          type: boolean
        sourceId:
          format: uuid
          type: string
        tagsetId:
          type: string
      required:
        - sourceId
        - destinationBucketId
        - authorizationId
      type: object
    http.CreateDocumentResponse:
      properties:
        externalID:
          type: string
        id:
          type: string
        imageHeight:
          type: integer
        imageWidth:
          type: integer
        mimeType:
          type: string
        reused:
          type: boolean
        size:
          type: integer
      required:
        - id
        - externalID
        - mimeType
        - size
        - reused
      type: object
    http.DeleteDocumentResponse:
      properties:
        authorizationId:
          type: string
        tagsetId:
          type: string
      required:
        - authorizationId
      type: object
    http.DocumentMetaResponse:
      properties:
        authorizationId:
          type: string
        createdBy:
          type: string
        createdDate:
          format: date-time
          type: string
        displayName:
          type: string
        externalID:
          type: string
        externalReference:
          type: string
        id:
          type: string
        mimeType:
          type: string
        size:
          type: integer
        storageBucketId:
          type: string
        tagsetId:
          type: string
        temporaryLocation:
          type: boolean
        updatedDate:
          format: date-time
          type: string
      required:
        - id
        - externalID
        - mimeType
        - size
        - displayName
        - temporaryLocation
        - storageBucketId
        - authorizationId
        - createdDate
        - updatedDate
      type: object
    http.LiveResponse:
      properties:
        status:
          type: string
      required:
        - status
      type: object
    http.MimeMismatchDetail:
      properties:
        detectedMime:
          type: string
        knownMime:
          type: string
      required:
        - knownMime
        - detectedMime
      type: object
    http.RejectedContentResponse:
      properties:
        code:
          type: string
        detail:
          $ref: '#/components/schemas/http.MimeMismatchDetail'
        error:
          type: string
      required:
        - code
        - error
      type: object
    http.ReplaceContentResponse:
      properties:
        externalID:
          type: string
        imageHeight:
          type: integer
        imageWidth:
          type: integer
        mimeType:
          type: string
        size:
          type: integer
      required:
        - externalID
        - mimeType
        - size
      type: object
    http.UpdateDocumentRequest:
      properties:
        authorizationId:
          type: string
        createdBy:
          type: string
        displayName:
          type: string
        externalReference:
          type: string
        storageBucketId:
          type: string
        temporaryLocation:
          type: boolean
      type: object
    http.UpdateDocumentResponse:
      properties:
        displayName:
          type: string
        id:
          type: string
        imageHeight:
          type: integer
        imageWidth:
          type: integer
        storageBucketId:
          type: string
        temporaryLocation:
          type: boolean
      required:
        - id
        - storageBucketId
        - temporaryLocation
        - displayName
      type: object
    http.errorResponse:
      properties:
        error:
          type: string
        message:
          type: string
      required:
        - error
        - message
      type: object
info:
  contact:
    email: info@alkem.io
    name: Alkemio Foundation
    url: https://alkem.io
  description: |
    Universal file I/O gateway and document lifecycle manager for the Alkemio platform.
    Provides authenticated file serving (public), document CRUD, image processing,
    and MIME validation (internal).
  license:
    name: EUPL-1.2
    url: https://opensource.org/licenses/EUPL-1.2
  title: Alkemio File Service
  version: 0.2.0
openapi: 3.1.1
paths:
  /internal/file:
    post:
      description: |-
        Create handles POST /internal/file — streaming ingest (spec 020): the
        file part flows request → sniff → (transcode) → staged storage without
        whole-file buffering. Parts are processed in whatever order they arrive;
        metadata validation always happens after the loop, before the stage is
        published. (The known caller sends the file part first — research R4 —
        which is why bucket-level limits cannot gate the stream early.)

        One ordering dependency exists (spec 013): skipImageProcessing is consumed
        when the file part is staged, so the verbatim/byte-exact contract can only
        be honored if it precedes the file. A skipImageProcessing=true that arrives
        AFTER the file part is rejected with 400 rather than silently transcoded.
      operationId: DocumentHandler.Create
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http.CreateDocumentResponse'
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http.errorResponse'
          description: Bad Request
        "408":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http.errorResponse'
          description: Request Timeout
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http.errorResponse'
          description: Conflict
        "413":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http.errorResponse'
          description: Request Entity Too Large
        "415":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http.errorResponse'
          description: Unsupported Media Type
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http.RejectedContentResponse'
          description: Unprocessable Entity
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http.errorResponse'
          description: Internal Server Error
      summary: |-
        Create handles POST /internal/file — streaming ingest (spec 020): the
        file part flows request → sniff → (transcode) → staged storage without
        whole-file buffering.
      tags:
        - /internal
  /internal/file/by-reference:
    get:
      description: |-
        ByReference handles GET /internal/file/by-reference?ref=<v>&bucketId=<uuid?>.
        ref is required. bucketId omitted → GLOBAL resolution (the provider's fetch:
        any document carrying the reference, all sharing one blob). bucketId present
        → bucket-SCOPED resolution (read resolution: the document in that bucket).
        200 → document meta; 404 → no match.
      operationId: DocumentHandler.ByReference
      parameters:
        - in: query
          name: ref
          schema:
            type: string
        - in: query
          name: bucketId
          schema:
            format: uuid
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http.DocumentMetaResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http.errorResponse'
          description: Bad Request
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http.errorResponse'
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http.errorResponse'
          description: Internal Server Error
      summary: ByReference handles GET /internal/file/by-reference?ref=<v>&bucketId=<uuid?>.
      tags:
        - /internal
  /internal/file/copy:
    post:
      description: |-
        Copy handles POST /internal/file/copy.
        Materializes a new file row in another bucket that references the same
        content as the source. No bytes traverse the wire — content is
        content-addressed, so the new row simply points at the existing blob.

        Per-bucket dedup applies by default; SkipDedup=true forces a fresh row.
        On dedup hit, caller-supplied authorizationId/tagsetId are ignored
        (existing row is authoritative), matching the createDocument contract.
      operationId: DocumentHandler.Copy
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/http.CopyDocumentRequest'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http.CreateDocumentResponse'
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http.errorResponse'
          description: Bad Request
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/source-document-not-found'
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/a-conflicting-document-already-exists-(unique-constraint)'
          description: Conflict
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internal-error'
          description: Internal Server Error
      summary: Copy handles POST /internal/file/copy.
      tags:
        - /internal
  /internal/file/{id}:
    delete:
      operationId: DocumentHandler.Delete
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: uuid
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http.DeleteDocumentResponse'
          description: OK
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http.errorResponse'
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http.errorResponse'
          description: Internal Server Error
      summary: Delete handles DELETE /internal/file/{id}
      tags:
        - /internal
    patch:
      description: |-
        Update handles PATCH /internal/file/{id}.
        Mutates the "move + re-attribute" fields: storageBucketId, temporaryLocation,
        displayName, authorizationId, createdBy, and externalReference. Each field is
        optional; at least one must produce an effective change. Omitted fields retain
        their current value; authorizationId, createdBy, and externalReference accept
        an explicit JSON null to clear.

        displayName notes:
          - Validation rejects empty/whitespace-only, length > 512 (matches
            the file."displayName" VARCHAR(512) column), path separators, and
            control characters.
          - mimeType is immutable on this endpoint, so callers renaming a file
            are responsible for keeping the extension consistent with mimeType.
            This service does not parse extensions or enforce mimeType matching.
          - displayName is not part of any uniqueness/dedup index, so renames
            never conflict at the DB level.
      operationId: DocumentHandler.Update
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/http.UpdateDocumentRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http.UpdateDocumentResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http.errorResponse'
          description: Bad Request
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http.errorResponse'
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http.errorResponse'
          description: Conflict
        "413":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http.errorResponse'
          description: Request Entity Too Large
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http.errorResponse'
          description: Internal Server Error
      summary: Update handles PATCH /internal/file/{id}.
      tags:
        - /internal
  /internal/file/{id}/content:
    get:
      operationId: DocumentHandler.GetContent
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: uuid
            type: string
      responses:
        "200":
          content:
            application/octet-stream:
              schema:
                format: binary
                type: string
          description: OK
        "404":
          content:
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/http.errorResponse'
          description: Not Found
        "500":
          content:
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/http.errorResponse'
          description: Internal Server Error
      summary: GetContent handles GET /internal/file/{id}/content
      tags:
        - /internal
    put:
      operationId: DocumentHandler.ReplaceContent
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: uuid
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http.ReplaceContentResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http.errorResponse'
          description: Bad Request
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http.errorResponse'
          description: Not Found
        "408":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http.errorResponse'
          description: Request Timeout
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http.errorResponse'
          description: Conflict
        "413":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http.errorResponse'
          description: Request Entity Too Large
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http.RejectedContentResponse'
          description: Unprocessable Entity
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http.errorResponse'
          description: Internal Server Error
      summary: ReplaceContent handles PUT /internal/file/{id}/content (store-and-link)
      tags:
        - /internal
  /internal/file/{id}/meta:
    get:
      operationId: DocumentHandler.GetMeta
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: uuid
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http.DocumentMetaResponse'
          description: OK
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http.errorResponse'
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http.errorResponse'
          description: Internal Server Error
      summary: GetMeta handles GET /internal/file/{id}/meta
      tags:
        - /internal
  /live:
    get:
      operationId: http.ServeLive
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http.LiveResponse'
          description: OK
      summary: |-
        ServeLive is the K8s liveness handler: returns 200 unconditionally so the
        probe reflects process-alive only, independent of DB/NATS availability.
  /rest/storage/file/{id}:
    get:
      operationId: PublicHandler.ServeDocument
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: uuid
            type: string
      responses:
        "200":
          content:
            application/octet-stream:
              schema:
                format: binary
                type: string
          description: OK
        "304":
          description: Not Modified
        "403":
          content:
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/http.errorResponse'
          description: Forbidden
        "404":
          content:
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/http.errorResponse'
          description: Not Found
        "500":
          content:
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/http.errorResponse'
          description: Internal Server Error
        "503":
          content:
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/http.errorResponse'
          description: Service Unavailable
      summary: ServeDocument handles GET /rest/storage/file/{id} (and the /rest/storage/document/{id} back-compat alias)
      tags:
        - /rest/storage
