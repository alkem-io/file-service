components:
  schemas:
    http.CopyDocumentRequest:
      properties:
        authorizationId:
          format: uuid
          type: string
        createdBy:
          format: uuid
          type: string
        destinationBucketId:
          format: uuid
          type: string
        skipDedup:
          type: boolean
        sourceId:
          format: uuid
          type: string
        tagsetId:
          format: uuid
          type: string
      required:
        - sourceId
        - destinationBucketId
        - authorizationId
      type: object
    http.CreateDocumentResponse:
      properties:
        externalID:
          type: string
        id:
          type: string
        imageHeight:
          type: integer
        imageWidth:
          type: integer
        mimeType:
          type: string
        reused:
          type: boolean
        size:
          type: integer
      required:
        - id
        - externalID
        - mimeType
        - size
        - reused
      type: object
    http.DeleteDocumentResponse:
      properties:
        authorizationId:
          type: string
        tagsetId:
          type: string
      required:
        - authorizationId
      type: object
    http.DocumentMetaResponse:
      properties:
        authorizationId:
          type: string
        createdBy:
          type: string
        createdDate:
          format: date-time
          type: string
        displayName:
          type: string
        externalID:
          type: string
        id:
          type: string
        mimeType:
          type: string
        size:
          type: integer
        storageBucketId:
          type: string
        tagsetId:
          type: string
        temporaryLocation:
          type: boolean
        updatedDate:
          format: date-time
          type: string
      required:
        - id
        - externalID
        - mimeType
        - size
        - displayName
        - temporaryLocation
        - storageBucketId
        - authorizationId
        - createdDate
        - updatedDate
      type: object
    http.LiveResponse:
      properties:
        status:
          type: string
      required:
        - status
      type: object
    http.MimeMismatchDetail:
      properties:
        detectedMime:
          type: string
        knownMime:
          type: string
      required:
        - knownMime
        - detectedMime
      type: object
    http.RejectedContentResponse:
      properties:
        code:
          type: string
        detail:
          $ref: '#/components/schemas/http.MimeMismatchDetail'
        error:
          type: string
      required:
        - code
        - error
      type: object
    http.ReplaceContentResponse:
      properties:
        externalID:
          type: string
        imageHeight:
          type: integer
        imageWidth:
          type: integer
        mimeType:
          type: string
        size:
          type: integer
      required:
        - externalID
        - mimeType
        - size
      type: object
    http.UpdateDocumentRequest:
      properties:
        displayName:
          type: string
        storageBucketId:
          format: uuid
          type: string
        temporaryLocation:
          type: boolean
      type: object
    http.UpdateDocumentResponse:
      properties:
        displayName:
          type: string
        id:
          type: string
        imageHeight:
          type: integer
        imageWidth:
          type: integer
        storageBucketId:
          type: string
        temporaryLocation:
          type: boolean
      required:
        - id
        - storageBucketId
        - temporaryLocation
        - displayName
      type: object
    http.errorResponse:
      properties:
        error:
          type: string
        message:
          type: string
      required:
        - error
        - message
      type: object
info:
  contact:
    email: info@alkem.io
    name: Alkemio Foundation
    url: https://alkem.io
  description: |
    Universal file I/O gateway and document lifecycle manager for the Alkemio platform.
    Provides authenticated file serving (public), document CRUD, image processing,
    and MIME validation (internal).
  license:
    name: EUPL-1.2
    url: https://opensource.org/licenses/EUPL-1.2
  title: Alkemio File Service
  version: 0.1.0
openapi: 3.1.1
paths:
  /internal/file:
    post:
      operationId: DocumentHandler.Create
      parameters:
        - in: form
          name: file
          schema:
            format: binary
            type: string
        - in: form
          name: displayName
          schema:
            type: string
        - in: form
          name: storageBucketId
          schema:
            format: uuid
            type: string
        - in: form
          name: authorizationId
          schema:
            format: uuid
            type: string
        - in: form
          name: tagsetId
          schema:
            format: uuid
            type: string
        - in: form
          name: createdBy
          schema:
            format: uuid
            type: string
        - in: form
          name: temporaryLocation
          schema:
            type: boolean
        - in: form
          name: skipDedup
          schema:
            type: boolean
        - in: form
          name: allowedMimeTypes
          schema:
            type: string
        - in: form
          name: maxFileSize
          schema:
            type: integer
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http.CreateDocumentResponse'
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http.errorResponse'
          description: Bad Request
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http.errorResponse'
          description: Conflict
        "413":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http.errorResponse'
          description: Request Entity Too Large
        "415":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http.errorResponse'
          description: Unsupported Media Type
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http.errorResponse'
          description: Unprocessable Entity
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http.errorResponse'
          description: Internal Server Error
      tags:
        - /internal
  /internal/file/copy:
    post:
      operationId: DocumentHandler.Copy
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/http.CopyDocumentRequest'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http.CreateDocumentResponse'
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http.errorResponse'
          description: Bad Request
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/source-document-not-found'
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/skipDedup-requested-but-a-row-with-this-content-already-exists-in-the-destination-bucket'
          description: Conflict
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internal-error'
          description: Internal Server Error
      tags:
        - /internal
  /internal/file/{id}:
    delete:
      operationId: DocumentHandler.Delete
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: uuid
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http.DeleteDocumentResponse'
          description: OK
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http.errorResponse'
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http.errorResponse'
          description: Internal Server Error
      tags:
        - /internal
    patch:
      operationId: DocumentHandler.Update
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/http.UpdateDocumentRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http.UpdateDocumentResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http.errorResponse'
          description: Bad Request
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http.errorResponse'
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http.errorResponse'
          description: Conflict
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http.errorResponse'
          description: Internal Server Error
      tags:
        - /internal
  /internal/file/{id}/content:
    get:
      operationId: DocumentHandler.GetContent
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: uuid
            type: string
      responses:
        "200":
          content:
            application/octet-stream:
              schema:
                format: binary
                type: string
          description: OK
        "404":
          content:
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/http.errorResponse'
          description: Not Found
        "500":
          content:
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/http.errorResponse'
          description: Internal Server Error
      tags:
        - /internal
    put:
      operationId: DocumentHandler.ReplaceContent
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: uuid
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http.ReplaceContentResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http.errorResponse'
          description: Bad Request
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http.errorResponse'
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http.errorResponse'
          description: Conflict
        "413":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http.errorResponse'
          description: Request Entity Too Large
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http.RejectedContentResponse'
          description: Unprocessable Entity
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http.errorResponse'
          description: Internal Server Error
      tags:
        - /internal
  /internal/file/{id}/meta:
    get:
      operationId: DocumentHandler.GetMeta
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: uuid
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http.DocumentMetaResponse'
          description: OK
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http.errorResponse'
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http.errorResponse'
          description: Internal Server Error
      tags:
        - /internal
  /live:
    get:
      operationId: http.ServeLive
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http.LiveResponse'
          description: OK
      summary: |-
        ServeLive is the K8s liveness handler: returns 200 unconditionally so the
        probe reflects process-alive only, independent of DB/NATS availability.
  /rest/storage/file/{id}:
    get:
      operationId: PublicHandler.ServeDocument
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: uuid
            type: string
      responses:
        "200":
          content:
            application/octet-stream:
              schema:
                format: binary
                type: string
          description: OK
        "304":
          content:
            application/octet-stream:
              schema:
                format: binary
                type: string
          description: Not Modified
        "403":
          content:
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/http.errorResponse'
          description: Forbidden
        "404":
          content:
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/http.errorResponse'
          description: Not Found
        "500":
          content:
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/http.errorResponse'
          description: Internal Server Error
        "503":
          content:
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/http.errorResponse'
          description: Service Unavailable
      tags:
        - /rest/storage
