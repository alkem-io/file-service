components:
  schemas:
    http.CreateDocumentResponse:
      properties:
        externalID:
          type: string
        id:
          type: string
        mimeType:
          type: string
        size:
          type: integer
      required:
        - id
        - externalID
        - mimeType
        - size
      type: object
    http.DeleteDocumentResponse:
      properties:
        authorizationId:
          type: string
        tagsetId:
          type: string
      required:
        - authorizationId
      type: object
    http.DocumentMetaResponse:
      properties:
        authorizationId:
          type: string
        createdBy:
          type: string
        createdDate:
          format: date-time
          type: string
        displayName:
          type: string
        externalID:
          type: string
        id:
          type: string
        mimeType:
          type: string
        size:
          type: integer
        storageBucketId:
          type: string
        tagsetId:
          type: string
        temporaryLocation:
          type: boolean
        updatedDate:
          format: date-time
          type: string
      required:
        - id
        - externalID
        - mimeType
        - size
        - displayName
        - temporaryLocation
        - storageBucketId
        - authorizationId
        - createdDate
        - updatedDate
      type: object
    http.ReplaceContentResponse:
      properties:
        externalID:
          type: string
        mimeType:
          type: string
        size:
          type: integer
      required:
        - externalID
        - mimeType
        - size
      type: object
    http.UpdateDocumentRequest:
      properties:
        storageBucketId:
          type: string
        temporaryLocation:
          type: boolean
      required:
        - storageBucketId
        - temporaryLocation
      type: object
    http.UpdateDocumentResponse:
      properties:
        id:
          type: string
        storageBucketId:
          type: string
        temporaryLocation:
          type: boolean
      required:
        - id
        - storageBucketId
        - temporaryLocation
      type: object
    http.errorResponse:
      properties:
        error:
          type: string
        message:
          type: string
      required:
        - error
        - message
      type: object
info:
  contact:
    email: info@alkem.io
    name: Alkemio Foundation
    url: https://alkem.io
  description: |
    Universal file I/O gateway and document lifecycle manager for the Alkemio platform.
    Provides authenticated file serving (public), document CRUD, image processing,
    and MIME validation (internal).
  license:
    name: EUPL-1.2
    url: https://opensource.org/licenses/EUPL-1.2
  title: Alkemio File Service
  version: 1.0.0
openapi: 3.1.1
paths:
  /internal/document:
    post:
      operationId: DocumentHandler.Create
      parameters:
        - in: form
          name: storageBucketId
          schema:
            type: string
        - in: form
          name: authorizationId
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http.errorResponse'
          description: OK
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http.CreateDocumentResponse'
          description: Created
      tags:
        - /internal
  /internal/document/{id}:
    delete:
      operationId: DocumentHandler.Delete
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http.DeleteDocumentResponse'
          description: OK
      tags:
        - /internal
    patch:
      operationId: DocumentHandler.Update
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/http.UpdateDocumentRequest'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http.UpdateDocumentResponse'
          description: OK
      tags:
        - /internal
  /internal/document/{id}/content:
    get:
      operationId: DocumentHandler.GetContent
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            github.com/alkem-io/file-service-go/internal/domain/model.Document.MimeType:
              schema:
                format: binary
                type: string
          description: OK
      tags:
        - /internal
    put:
      operationId: DocumentHandler.ReplaceContent
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http.ReplaceContentResponse'
          description: OK
      tags:
        - /internal
  /internal/document/{id}/meta:
    get:
      operationId: DocumentHandler.GetMeta
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http.DocumentMetaResponse'
          description: OK
      tags:
        - /internal
  /rest/storage/document/{id}:
    get:
      operationId: PublicHandler.ServeDocument
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            github.com/alkem-io/file-service-go/internal/domain/model.Document.MimeType:
              schema:
                format: binary
                type: string
          description: OK
        "304":
          content:
            github.com/alkem-io/file-service-go/internal/domain/model.Document.MimeType:
              schema:
                $ref: '#/components/schemas/http.errorResponse'
          description: Not Modified
      tags:
        - /rest/storage
